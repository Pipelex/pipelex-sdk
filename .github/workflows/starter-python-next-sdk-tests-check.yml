# Rendered by `make workflows` from starter-python/.github/workflows/tests-check.yml — edit that file and re-render.
# It tests starter-python, extracted as the export ships it, against pipelex-sdk built from the
# same commit, installed over the registry's copy. It is reported, not required.
# Unlike its source, it turns telemetry off with its env, as every workflow of this repository does.
name: Tests check (starter-python, next SDK)

on:
  pull_request:
    paths:
      - "starter-python/**"
      - "python/**"
      - ".github/workflows/starter-python-next-sdk-tests-check.yml"

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  matrix-test:
    name: Tests check (starter-python, next SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../standalone/starter-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/../standalone/starter-python/.venv
      ENV: dev
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract starter-python as the export ships it
        working-directory: .
        run: |
          rm -rf ../standalone/starter-python && mkdir -p ../standalone/starter-python
          git archive HEAD:starter-python | tar -x -C ../standalone/starter-python
          cd ../standalone/starter-python
          git init -q -b main
          git add -A -f
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "starter-python, as a project made from it starts"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check UV installation
        run: make check-uv

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: make install

      - name: Install pipelex-sdk built from this commit
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/next-sdk" "$GITHUB_WORKSPACE/python"
          uv export --frozen --no-hashes --no-header --no-annotate --no-dev --no-emit-project --project "$GITHUB_WORKSPACE/python" | grep -E '^mthds( |=|@)' > "$RUNNER_TEMP/next-sdk/mthds.txt"
          uv pip install --python .venv/bin/python --reinstall-package pipelex-sdk --reinstall-package mthds -r "$RUNNER_TEMP/next-sdk/mthds.txt" "$RUNNER_TEMP"/next-sdk/*.whl

      - name: Run tests
        run: make gha-tests

      - name: The interpreter is the one this job names
        run: .venv/bin/python -c 'import sys; want = "${{ matrix.python-version }}"; got = "%d.%d" % sys.version_info[:2]; assert got == want, f"ran {got}, expected {want}"'
