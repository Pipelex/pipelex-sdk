# Rendered by `make workflows` from starter-python/.github/workflows/tests-check.yml — edit that file and re-render.
# It tests starter-python, extracted as the export ships it, against pipelex-sdk built from the
# same commit, installed over the registry's copy. It is reported, not required.
name: Tests check (starter-python, next SDK)

on:
  pull_request:
    paths:
      - "starter-python/**"
      - "python/**"
      - ".github/workflows/starter-python-next-sdk-tests-check.yml"

jobs:
  matrix-test:
    name: Tests check (starter-python, next SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../standalone/starter-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/../standalone/starter-python/.venv
      ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Extract starter-python as the export ships it
        working-directory: .
        run: |
          rm -rf ../standalone/starter-python && mkdir -p ../standalone/starter-python
          git archive HEAD:starter-python | tar -x -C ../standalone/starter-python
          cd ../standalone/starter-python
          git init -q -b main
          git add -A -f
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "starter-python, as a project made from it starts"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check UV installation
        run: make check-uv

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: PYTHON_VERSION=${{ matrix.python-version }} make install

      - name: Install pipelex-sdk built from this commit
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/next-sdk" "$GITHUB_WORKSPACE/python"
          uv pip install --python .venv/bin/python --reinstall-package pipelex-sdk "$RUNNER_TEMP"/next-sdk/*.whl

      - name: Run tests
        run: make gha-tests
