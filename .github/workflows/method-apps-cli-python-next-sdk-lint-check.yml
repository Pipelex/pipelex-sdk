# Rendered by `make workflows` from method-apps/cli-python/.github/workflows/lint-check.yml — edit that file and re-render.
# It tests method-apps/cli-python, extracted as the export ships it, against pipelex-sdk built from the
# same commit, installed over the registry's copy. It is reported, not required.
# Unlike its source, it turns telemetry off with its env, as every workflow of this repository does.
name: Lint check (method-apps/cli-python, next SDK)

on:
  pull_request:
    paths:
      - "method-apps/cli-python/**"
      - "python/**"
      - ".github/workflows/method-apps-cli-python-next-sdk-lint-check.yml"

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint on Python ${{ matrix.python-version }} (method-apps/cli-python, next SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../standalone/method-apps-cli-python
    strategy:
      fail-fast: false
      matrix:
        # The floor of requires-python, and the latest version it allows.
        python-version: ["3.11", "3.14"]
    env:
      # `make install` runs `uv sync`, which then refuses a uv.lock that
      # pyproject.toml has moved away from instead of rewriting it.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Extract method-apps/cli-python as the export ships it
        working-directory: .
        run: |
          rm -rf ../standalone/method-apps-cli-python && mkdir -p ../standalone/method-apps-cli-python
          git archive HEAD:method-apps/cli-python | tar -x -C ../standalone/method-apps-cli-python
          cd ../standalone/method-apps-cli-python
          git init -q -b main
          git add -A -f
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "method-apps/cli-python, as a project made from it starts"

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: method-apps/cli-python/uv.lock

      - name: Install dependencies
        run: make install

      - name: Install pipelex-sdk built from this commit
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/next-sdk" "$GITHUB_WORKSPACE/python"
          uv export --frozen --no-hashes --no-header --no-annotate --no-dev --no-emit-project --project "$GITHUB_WORKSPACE/python" | grep -E '^mthds( |=|@)' > "$RUNNER_TEMP/next-sdk/mthds.txt"
          uv pip install --python .venv/bin/python --reinstall-package pipelex-sdk --reinstall-package mthds -r "$RUNNER_TEMP/next-sdk/mthds.txt" "$RUNNER_TEMP"/next-sdk/*.whl

      - name: Run check (lint + format + typecheck)
        run: make check

      - name: The interpreter is the one this job names
        run: .venv/bin/python -c 'import sys; want = "${{ matrix.python-version }}"; got = "%d.%d" % sys.version_info[:2]; assert got == want, f"ran {got}, expected {want}"'
