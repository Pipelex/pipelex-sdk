# Rendered by `make workflows` from method-apps/webapp-js/.github/workflows/tests-check.yml — edit that file and re-render.
# It tests method-apps/webapp-js, extracted as the export ships it, against @pipelex/sdk built from the
# same commit, installed over the registry's copy. It is reported, not required.
name: Tests check (method-apps/webapp-js, next SDK)

on:
  pull_request:
    paths:
      - "method-apps/webapp-js/**"
      - "js/**"
      - ".github/workflows/method-apps-webapp-js-next-sdk-tests-check.yml"

jobs:
  tests:
    name: Tests (method-apps/webapp-js, next SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../standalone/method-apps-webapp-js
    steps:
      - uses: actions/checkout@v5

      - name: Extract method-apps/webapp-js as the export ships it
        working-directory: .
        run: |
          rm -rf ../standalone/method-apps-webapp-js && mkdir -p ../standalone/method-apps-webapp-js
          git archive HEAD:method-apps/webapp-js | tar -x -C ../standalone/method-apps-webapp-js
          cd ../standalone/method-apps-webapp-js
          git init -q -b main
          git add -A -f
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "method-apps/webapp-js, as a project made from it starts"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: method-apps/webapp-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install @pipelex/sdk built from this commit
        run: |
          mkdir -p "$RUNNER_TEMP/next-sdk"
          (cd "$GITHUB_WORKSPACE/js" && make install && npm pack --pack-destination "$RUNNER_TEMP/next-sdk")
          npm install --no-save "$RUNNER_TEMP"/next-sdk/*.tgz

      - name: Run unit tests
        run: make agent-test

      - name: Build
        run: make build
