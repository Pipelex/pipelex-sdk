# The template's own maintenance, not a project's: every job runs only in
# Pipelex/pipelex-starter-python, so a repository made with "Use this template" inherits
# this file inert, and /bootstrap deletes it. A workflow added for the template's own
# maintenance carries the same guard on every job and joins MAINTAINER_ONLY_PATHS in the
# bootstrap script; tests/unit/test_bootstrap_script.py holds the two together.
name: Changelog Version Check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    if: github.repository == 'Pipelex/pipelex-starter-python' && startsWith(github.head_ref, 'release/v')  # Only run on the template's release branches
    steps:
      - uses: actions/checkout@v4

      - name: Check Changelog Version
        run: |
          # Get the current branch name and extract version
          BRANCH_NAME=${GITHUB_HEAD_REF}
          
          if [[ $BRANCH_NAME =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Checking release branch v$VERSION against changelog..."
            
            # Look for the version in the changelog
            if ! grep -q "## \[v$VERSION\] -" CHANGELOG.md; then
              echo "❌ Error: No changelog entry found for version v$VERSION"
              echo "The following versions are in the changelog:"
              grep -E "^## \[v[0-9]+\.[0-9]+\.[0-9]+\]" CHANGELOG.md
              echo "Please add a changelog entry for v$VERSION before merging this release to main"
              exit 1
            else
              echo "✅ Changelog entry found for version v$VERSION"
            fi
          else
            echo "❌ Error: Branch name $BRANCH_NAME does not match expected format 'release/vX.Y.Z'"
            exit 1
          fi 
