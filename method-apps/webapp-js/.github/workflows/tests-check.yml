name: Tests check

on:
  pull_request:

# A step with no shell of its own runs in bash on every runner, Windows
# included, where Git for Windows provides it. The Windows job's own steps say
# `shell: pwsh`, since they prove the app's scripts without bash.
defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: make agent-test

      - name: Build
        run: make build

  # The tests of the scripts written for Windows, under PowerShell, with neither
  # make nor bash: the dev server in the background (npm run serve), with no
  # cmd.exe in the tree it starts, the dev and start scripts, and how the
  # scripts run npm.
  windows:
    name: Scripts on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      # npm clean-install is npm ci by its long name.
      - name: Install dependencies
        shell: pwsh
        run: npm clean-install

      - name: Run those tests, with Git's bash and its tools off the PATH
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch '\\Git\\(usr\\)?bin' }) -join ';'
          npx vitest run scripts/lib/serve scripts/lib/run-next scripts/lib/npm scripts/lib/create
