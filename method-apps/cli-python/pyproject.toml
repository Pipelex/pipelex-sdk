[project]
name = "pipelex-method-cli-python"
version = "0.34.0"
description = "A command-line tool that runs one MTHDS method through the Pipelex API."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"
# `Private :: Do Not Upload` is a classifier PyPI refuses, so neither this template nor a project
# made from it can be published by accident.
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]

# Every package imported at module level by the CLI is declared here, including those that also
# arrive transitively: `mthds`, `pydantic` and `httpx` come with `pipelex-sdk` and `rich` comes with
# `typer`, and each is imported directly (`mthds.protocol.exceptions` in the error layer and the
# lifecycle, `pydantic.BaseModel` in the binding and in the generated models, `rich` in the cost
# report and the status line, and `httpx`, the SDK's transport, for the errors the SDK leaves as
# httpx's own, which the lifecycle names when saving a run's files fails). A transitive dependency is
# not a contract. The `mthds` floor is the version `pipelex-sdk` pins exactly today, which is a floor
# and not a second pin: the SDK's exact pin always satisfies it, so bumping the SDK never has to be
# matched here. The `pydantic` range is the SDK's own, since the generated models are pydantic 2 models.
dependencies = [
  "httpx>=0.27.0",
  "mthds>=0.19.0",
  "pipelex-sdk>=0.31.0",
  "pydantic>=2.10.6,<3.0.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
  "typer>=0.15.0",
]

[project.scripts]
pipelex-method-cli-python = "pipelex_method_cli_python.cli:main"

# Installed by `uv sync` by default, which is what `make install` runs. The tests also build an SDK
# error the way the SDK raises it, through a client over a faked transport, and the codegen scripts,
# which run only in this environment, catch the transport errors the SDK leaves unmapped, both with
# `httpx`, which the CLI's own dependencies declare.
[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel carries the whole package directory, so the method under `method/` and the generated
# tree under `generated/` ship with the code that reads them: an installed CLI has no repository
# around it.
[tool.hatch.build.targets.wheel]
packages = ["src/pipelex_method_cli_python"]

[tool.uv]
required-version = ">=0.7.2"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# The project's root, so the tests import `tests.support` and the `scripts` modules as packages.
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true

[tool.ruff]
# The generated tree is written verbatim by `make codegen` and stamped; reformatting it would break
# its stamps, so ruff never touches it. Pyright still checks it, which is the check that matters.
extend-exclude = ["src/pipelex_method_cli_python/generated"]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "E501",
  "F",
  "I",
  "A001",
  "A002",
  "A003",
  "RUF008",
  "RUF009",
  "RUF012",
  "RUF013",
  "RUF100",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["src", "tests", "scripts"]
exclude = [
  "**/__pycache__",
  ".venv",
  ".git",
  "build",
  "dist",
  "**/node_modules",
  "**/.*",
]
analyzeUnannotatedFunctions = true
deprecateTypingAliases = false
disableBytesTypePromotions = true
enableExperimentalFeatures = false
enableTypeIgnoreComments = true
reportAbstractUsage = "error"
reportArgumentType = "error"
reportAssertAlwaysTrue = "error"
reportAssertTypeFailure = "error"
reportAssignmentType = "error"
reportAttributeAccessIssue = "error"
reportCallInDefaultInitializer = true
reportCallIssue = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportDuplicateImport = "error"
reportFunctionMemberAccess = "error"
reportGeneralTypeIssues = "error"
reportImplicitOverride = true
reportImplicitStringConcatenation = false
reportImportCycles = true
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportIncompleteStub = "error"
reportInconsistentConstructor = "error"
reportInconsistentOverload = "error"
reportIndexIssue = "error"
reportInvalidStringEscapeSequence = "error"
reportInvalidStubStatement = "error"
reportInvalidTypeArguments = "error"
reportInvalidTypeForm = "error"
reportInvalidTypeVarUse = "error"
reportMatchNotExhaustive = "error"
reportMissingImports = "error"
reportMissingModuleSource = "warning"
reportMissingParameterType = "error"
reportMissingSuperCall = "none"
reportMissingTypeArgument = "error"
reportMissingTypeStubs = false
reportNoOverloadImplementation = "error"
reportOperatorIssue = "error"
reportOptionalCall = "error"
reportOptionalContextManager = "error"
reportOptionalIterable = "error"
reportOptionalMemberAccess = "error"
reportOptionalOperand = "error"
reportOptionalSubscript = "error"
reportOverlappingOverload = "error"
reportPossiblyUnboundVariable = "error"
reportPrivateImportUsage = "error"
reportPrivateUsage = "error"
reportPropertyTypeMismatch = true
reportRedeclaration = "error"
reportReturnType = "error"
reportSelfClsParameterName = "error"
reportTypeCommentUsage = "error"
reportTypedDictNotRequiredAccess = "error"
reportUnboundVariable = "error"
reportUndefinedVariable = "error"
reportUninitializedInstanceVariable = "none"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryTypeIgnoreComment = "none"
reportUnsupportedDunderAll = "error"
reportUntypedBaseClass = "error"
reportUntypedClassDecorator = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportUnusedCallResult = "none"
reportUnusedClass = "error"
reportUnusedCoroutine = "error"
reportUnusedExcept = "error"
reportUnusedExpression = "error"
reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportWildcardImportFromLibrary = "error"
strictDictionaryInference = true
strictListInference = true
strictParameterNoneValue = true
strictSetInference = true
typeCheckingMode = "strict"
