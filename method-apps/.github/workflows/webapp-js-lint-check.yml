# Rendered by `make workflows` from webapp-js/.github/workflows/lint-check.yml — edit that file and re-render.
# GitHub reads workflows only at the repository root, and the template's own copy travels
# into every project created from it, so the root runs this twin inside the template.
name: Lint check (webapp-js)

on:
  pull_request:

jobs:
  lint:
    name: Lint (webapp-js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-js
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run check (lint + format + typecheck + codegen)
        run: make check
